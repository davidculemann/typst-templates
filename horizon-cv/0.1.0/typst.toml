[package]
name = "horizon-cv"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["JobSprout <https://jobsprout.ai>"]
license = "MIT AND MIT-0"
description = "Single-column CV under a full-bleed colour band."
homepage = "https://www.jobsprout.ai/resume-templates/horizon"
repository = "https://github.com/davidculemann/typst-templates"
keywords = ["cv", "resume", "curriculum vitae"]
