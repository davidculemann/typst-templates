[package]
name = "sentinel-cv"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["JobSprout <https://jobsprout.ai>"]
license = "MIT AND MIT-0"
description = "Traditional CV with small-caps headings and fine rules."
homepage = "https://www.jobsprout.ai/resume-templates/classic"
repository = "https://github.com/davidculemann/typst-templates"
keywords = ["cv", "resume", "curriculum vitae"]
categories = ["cv"]
exclude = ["doc"]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
